[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-dance-agent"
version = "0.1.0"
description = "Natural-language-driven gesture-dance video editing agent (multi-module)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=1.10,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
gesture-intent = "gesture_intent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
